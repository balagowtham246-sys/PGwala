name: Supabase Weekly Database Backup

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  backup:
    name: Run pg_dump & Save Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Perform Database Dump
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          mkdir -p backups
          DUMP_FILENAME="pgwala_backup_${TIMESTAMP}.sql.gz"
          echo "Starting pg_dump..."
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" --clean --if-exists --no-owner --no-privileges | gzip > "backups/${DUMP_FILENAME}"
          echo "Dump created: ${DUMP_FILENAME}"
          ls -lh backups/
          echo "BACKUP_NAME=${DUMP_FILENAME}" >> $GITHUB_ENV

      - name: Upload Backup to Secure GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: backups/*.sql.gz
          retention-days: 90

