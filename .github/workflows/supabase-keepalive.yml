name: Supabase Keepalive Ping

on:
  schedule:
    # Run every 3 days at 04:00 UTC to prevent the 7-day inactivity pause
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  keepalive:
    name: Prevent Inactivity Sleep
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Sending keepalive request to Supabase project..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_PROJECT_URL }}/rest/v1/properties?select=id&limit=1")
          
          echo "Supabase responded with HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Keepalive ping successful. Inactivity timer reset."
          else
            echo "Warning: Received unexpected HTTP status $STATUS"
            exit 1
          fi

